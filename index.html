<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Restaurant</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="container">
            <h1>🍽️ Online Restaurant</h1>
            <nav>
                <button id="menu-btn" class="nav-btn active">Menu</button>
                <button id="cart-btn" class="nav-btn">
                    Cart <span id="cart-count">0</span>
                </button>
            </nav>
        </div>
    </header>

    <main class="container">
        <div id="menu-page" class="page">
            <h2>Our Menu</h2>

            <div class="filters">
                <h3>Filters</h3>

                <div class="filter-section">
                    <label>Category:</label>
                    <div class="category-buttons">
                        <button class="category-btn active" data-category="all">All</button>
                        <button class="category-btn" data-category="Salads">Salads</button>
                        <button class="category-btn" data-category="Soups">Soups</button>
                        <button class="category-btn" data-category="Chicken-Dishes">Chicken</button>
                        <button class="category-btn" data-category="Beef-Dishes">Beef</button>
                        <button class="category-btn" data-category="Seafood-Dishes">Seafood</button>
                        <button class="category-btn" data-category="Vegetable-Dishes">Vegetables</button>
                        <button class="category-btn" data-category="Bits&Bites">Bits & Bites</button>
                        <button class="category-btn" data-category="On-The-Side">On The Side</button>
                    </div>
                </div>

                <div class="filter-row">
                    <div class="filter-group">
                        <label>🌶️ Spiciness:</label>
                        <select id="spiciness-filter">
                            <option value="">Any</option>
                            <option value="0">No Spice (0)</option>
                            <option value="1">Mild (1)</option>
                            <option value="2">Medium (2)</option>
                            <option value="3">Hot (3)</option>
                            <option value="4">Extra Hot (4)</option>
                        </select>
                    </div>

                    <div class="filter-group">
                        <label>🥜 Contains Nuts:</label>
                        <select id="nuts-filter">
                            <option value="">Any</option>
                            <option value="true">Yes</option>
                            <option value="false">No</option>
                        </select>
                    </div>

                    <div class="filter-group">
                        <label>🌱 Vegetarian:</label>
                        <select id="vegetarian-filter">
                            <option value="">Any</option>
                            <option value="true">Yes</option>
                            <option value="false">No</option>
                        </select>
                    </div>
                </div>

                <button id="reset-filters" class="reset-btn">Reset Filters</button>
            </div>

            <div id="loading" class="loading">Loading dishes...</div>
            <div id="dishes-count" class="dishes-count"></div>
            <div id="dishes-container" class="dishes-grid"></div>
        </div>

        <div id="cart-page" class="page" style="display: none;">
            <h2>Shopping Cart</h2>
            <div id="cart-container"></div>
            <div id="cart-empty" class="empty-cart" style="display: none;">
                Your cart is empty. Go to menu to add some dishes!
            </div>
            <div id="cart-summary" class="cart-summary" style="display: none;">
                <div class="summary-row">
                    <span>Subtotal:</span>
                    <span id="subtotal">$0.00</span>
                </div>
                <div class="summary-row">
                    <span>Tax (10%):</span>
                    <span id="tax">$0.00</span>
                </div>
                <div class="summary-row total">
                    <span>Total:</span>
                    <span id="total">$0.00</span>
                </div>
                <button class="order-btn">Place Order</button>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
